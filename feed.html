<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="feed-page">
    <header>
            <h1>Welcome to my Feed!</h1>
        </header>
    <main class="feed-main">
        <aside class="home-link">
            <a href="index.html" aria-label="Return to homepage">
                <img src="img/video/penguin.gif" alt="Return to homepage">
            </a>
        </aside>

        <div class="feed-posts">

            <section class="post-card">
                <figure>
                    <video width="275" height="350" controls>
                        <source src="img/video/WakeyWakey.mp4" type="video/mp4">
                    </video>
                    <figcaption>Wakey wakey</figcaption>
                </figure>
            </section>
            
            <section class="post-card">
                <figure>
                    <video width="275" height="350" controls>
                        <source src="img/video/Weather.mp4" type="video/mp4">
                    </video>
                    <figcaption>Check the weather for the OOTD</figcaption>
                </figure>
            </section>

            <section class="post-card">
                <figure>
                    <img src="img/sunset.png" alt="Sunset Image" width="275" height="350">
                </figure>
                <figcaption>Caught this sunset last week</figcaption>
            </section>

            <section class="post-card">
                <figure>
                    <img src="img/coffee.png" alt="Coffee Image" width="275" height="350">
                </figure>
                <figcaption>First time at Kissaten Coffee</figcaption>
            </section>

            <section class="post-card">
                <figure>
                    <img src="img/room.png" alt="Room Image" width="275" height="350">
                </figure>
                <figcaption>Room Aesthetic!</figcaption>
            </section>

            <section class="post-card">
                <figure>
                    <img src="img/BayBridge.png" alt="Bay Bridge at night" width="580" height="375">
                    <figcaption>Bay Bridge at night</figcaption>
                </figure>
            </section>

            <section class="post-card">
                <figure>
                    <img src="img/coding.png" alt="Coding on a computer" width="350" height="275">
                    <figcaption>Late night coding session</figcaption>
                </figure>
            </section>

            <section class="post-card">
                <figure>
                    <img src="img/nightShift.png" alt="Night shift" width="275" height="350">
                    <figcaption>Another night shift</figcaption>
                </figure>
            </section>

            <section class="post-card">
                <figure>
                    <video width="275" height="350" controls>
                        <source src="img/video/CoffeeTime.mp4" type="video/mp4">
                </video>
                <figcaption>Daily bus ride for some coffee</figcaption>
            </figure>
            </section>

            <section class="post-card">
                <figure>
                    <video width="275" height="350" controls>
                        <source src="img/video/GGBridge.mp4" type="video/mp4">
                    </video>
                    <figcaption>Golden Gate Bridge</figcaption>
                </figure>
            </section>

            <section class="post-card">
                <figure>
                    <video width="275" height="350" controls>
                        <source src="img/video/hackathon.mp4" type="video/mp4">
                    </video>
                    <figcaption>Hackathon energy</figcaption>
                </figure>
            </section>

            <section class="post-card">
                <figure>
                    <video width="275" height="350" controls>
                        <source src="img/video/posts.mp4" type="video/mp4">
                    </video>
                    <figcaption>New posts are up!</figcaption>
                </figure>
            </section>

        </div>

        <aside class="about-me">
            <h2>About Me</h2>
            <div class="about-images">
                <img src="img/me1.png" alt="Portrait of me">
                <img src="img/me3.png" alt="Another portrait of me">
                <img src="img/me2.png" alt="Another portrait of me">
            </div>
            <p>Hi! I’m the person behind this feed. My name is Andrew I am a 3rd Year Computer Science major. I also play guitar, baseball, pickleball, and I am a dancer and cultural dance choreographer. </p>
        </aside>

    </main>
</body>
</html>
